name = "rhlemmas"
srcDir = "src"
defaultTargets = ["RhLemmas"]

# Same Mathlib pin as the source repository (source/lakefile.toml).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "RhLemmas"
globs = ["RhLemmas.+", "RhLemmas"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
